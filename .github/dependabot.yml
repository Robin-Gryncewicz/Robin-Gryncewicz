      interval: "daily" # TODO: Updated for testing. Ensure this is changed to 'weekly' before merging to production.
    target-branch: "dotnet.core.api.cdk"
    allow:
      - dependency-name: "@autoscout24/aws-cdk"
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily" # TODO: Updated for testing. Ensure this is changed to 'weekly' before merging to production.
    target-branch: "dotnet.core.api.cdk"
    update-types:
      - "version-update:semver-major"
      - "version-update:semver-minor"
